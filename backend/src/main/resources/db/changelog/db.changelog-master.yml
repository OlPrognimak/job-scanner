databaseChangeLog:
  - changeSet:
      id: 000-create-schema
      author: oleksandr-prognimak
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS ${db-schema}
      rollback:
        - sql:
            sql: DROP SCHEMA IF EXISTS ${db-schema} CASCADE
  - changeSet:
      id: 001-create-job-offer
      author: oleksandr-prognimak
      changes:
        - createTable:
            schemaName: ${db-schema}
            tableName: job_offer
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(300)
                  constraints:
                    nullable: false
              - column:
                  name: company
                  type: VARCHAR(240)
              - column:
                  name: location
                  type: VARCHAR(240)
              - column:
                  name: remote_type
                  type: VARCHAR(40)
              - column:
                  name: contract_type
                  type: VARCHAR(40)
              - column:
                  name: description
                  type: ${text-type}
                  constraints:
                    nullable: false
              - column:
                  name: job_url
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: detected_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: match_score
                  type: INT
              - column:
                  name: match_explanation
                  type: ${text-type}
              - column:
                  name: rate_or_salary
                  type: NUMERIC(12,2)
  - changeSet:
      id: 001-add-job-offer-published-at
      author: oleksandr-prognimak
      changes:
        - addColumn:
            schemaName: ${db-schema}
            tableName: job_offer
            columns:
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
        - sql:
            sql: UPDATE ${db-schema}.job_offer SET published_at = detected_at WHERE published_at IS NULL
      rollback:
        - dropColumn:
            schemaName: ${db-schema}
            tableName: job_offer
            columnName: published_at
  - changeSet:
      id: 001-clear-copied-job-offer-published-at
      author: oleksandr-prognimak
      changes:
        - sql:
            sql: UPDATE ${db-schema}.job_offer SET published_at = NULL WHERE published_at = detected_at
      rollback: []
  - changeSet:
      id: 001-widen-job-offer-summary-fields
      author: oleksandr-prognimak
      changes:
        - modifyDataType:
            schemaName: ${db-schema}
            tableName: job_offer
            columnName: title
            newDataType: ${text-type}
        - modifyDataType:
            schemaName: ${db-schema}
            tableName: job_offer
            columnName: company
            newDataType: ${text-type}
        - modifyDataType:
            schemaName: ${db-schema}
            tableName: job_offer
            columnName: location
            newDataType: ${text-type}
      rollback:
        - modifyDataType:
            schemaName: ${db-schema}
            tableName: job_offer
            columnName: title
            newDataType: VARCHAR(300)
        - modifyDataType:
            schemaName: ${db-schema}
            tableName: job_offer
            columnName: company
            newDataType: VARCHAR(240)
        - modifyDataType:
            schemaName: ${db-schema}
            tableName: job_offer
            columnName: location
            newDataType: VARCHAR(240)
  - changeSet:
      id: 001-widen-job-offer-url
      author: oleksandr-prognimak
      changes:
        - sql:
            sql: ALTER TABLE ${db-schema}.job_offer DROP CONSTRAINT IF EXISTS job_offer_job_url_key
        - modifyDataType:
            schemaName: ${db-schema}
            tableName: job_offer
            columnName: job_url
            newDataType: ${text-type}
      rollback:
        - modifyDataType:
            schemaName: ${db-schema}
            tableName: job_offer
            columnName: job_url
            newDataType: VARCHAR(1000)
  - changeSet:
      id: 002-create-application-draft
      author: oleksandr-prognimak
      changes:
        - createTable:
            schemaName: ${db-schema}
            tableName: application_draft
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_offer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_application_draft_job_offer
                    references: ${db-schema}.job_offer(id)
              - column:
                  name: anschreiben_text
                  type: ${text-type}
                  constraints:
                    nullable: false
              - column:
                  name: cv_file_path
                  type: VARCHAR(1000)
              - column:
                  name: cv_document_id
                  type: VARCHAR(200)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
  - changeSet:
      id: 003-create-search-criteria
      author: oleksandr-prognimak
      changes:
        - createTable:
            schemaName: ${db-schema}
            tableName: job_search_criteria
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
              - column:
                  name: keyword
                  type: VARCHAR(240)
              - column:
                  name: location
                  type: VARCHAR(240)
              - column:
                  name: remote_type
                  type: VARCHAR(40)
              - column:
                  name: contract_type
                  type: VARCHAR(40)
              - column:
                  name: min_rate
                  type: NUMERIC(12,2)
              - column:
                  name: language
                  type: VARCHAR(80)
              - column:
                  name: source_website
                  type: VARCHAR(120)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
  - changeSet:
      id: 004-seed-default-criteria
      author: oleksandr-prognimak
      changes:
        - insert:
            schemaName: ${db-schema}
            tableName: job_search_criteria
            columns:
              - column:
                  name: name
                  value: Java Spring Remote
              - column:
                  name: keyword
                  value: Java Spring Boot
              - column:
                  name: location
                  value: Remote
              - column:
                  name: remote_type
                  value: REMOTE
              - column:
                  name: contract_type
                  value: FREELANCE
              - column:
                  name: min_rate
                  valueNumeric: 750
              - column:
                  name: language
                  value: Deutsch
              - column:
                  name: source_website
                  value: mock
              - column:
                  name: active
                  valueBoolean: true
