services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_scanner
      POSTGRES_USER: job_scanner
      POSTGRES_PASSWORD: job_scanner
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_scanner -d job_scanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8088
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      CANDIDATE_PROFILE_PATH: classpath:candidate-profile.md
      CANDIDATE_CONTEXT_PATH: file:/app/documents/candidate-context.md
      CV_FILE_PATH: /app/documents/cv.docx
    ports:
      - "8088:8088"
    volumes:
      - ./documents:/app/documents:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres-data:
